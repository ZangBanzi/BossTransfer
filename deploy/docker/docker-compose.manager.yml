services:
  manager:
    build:
      context: .
      dockerfile: manager-runtime.Dockerfile
    image: bosstransfer/manager:2.1.0
    user: "${BOSSTRANSFER_MANAGER_RUN_AS:-0:0}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${BOSSTRANSFER_MANAGER_HTTP_PORT:-18085}:8085"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BOSSTRANSFER_MANAGER_ADDR: "0.0.0.0:8085"
      BOSSTRANSFER_MANAGER_PUBLIC_PORT: "${BOSSTRANSFER_MANAGER_HTTP_PORT:-18085}"
      BOSSTRANSFER_DATA_DIR: "/var/lib/bosstransfer"
      BOSSTRANSFER_MANAGER_USER: "${BOSSTRANSFER_MANAGER_USER:-admin}"
      BOSSTRANSFER_MANAGER_PASSWORD: "${BOSSTRANSFER_MANAGER_PASSWORD:-password}"
      BOSSTRANSFER_LICENSE_PEPPER: "${BOSSTRANSFER_LICENSE_PEPPER:-}"
      BOSSTRANSFER_115_CLIENT_ID: "${BOSSTRANSFER_115_CLIENT_ID:-}"
      BOSSTRANSFER_LOG_LEVEL: "${BOSSTRANSFER_LOG_LEVEL:-info}"
    volumes:
      - manager-data:/var/lib/bosstransfer
    healthcheck:
      test: ["CMD", "/manager", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  manager-data:
    name: "${BOSSTRANSFER_MANAGER_DATA_VOLUME:-bosstransfer_manager-data}"
